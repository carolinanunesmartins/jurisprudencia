name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    name: pipeline (lint, unit, regression)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --frozen || uv sync
      - run: uv run ruff check pipeline
      - run: uv run ruff format --check pipeline
      - name: Unit tests
        run: uv run pytest -m unit
      - name: Regression tests
        run: uv run pytest -m regression
      - name: Data check (published JSON; no database in CI, so grounding is skipped)
        run: uv run python -m juris.export.check

  web:
    name: web (typecheck, lint, unit + regression, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-dist
          path: web/dist

  # Stable single check to mark as "required" in branch protection.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [pipeline, web]
    runs-on: ubuntu-latest
    steps:
      - run: |
          [ "${{ needs.pipeline.result }}" = "success" ] && [ "${{ needs.web.result }}" = "success" ]
